services:
  db:
    image: postgres:17-alpine
    container_name: meraglym-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meraglym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meraglym_password}
      POSTGRES_DB: ${POSTGRES_DB:-meraglym_osint}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-meraglym} -d $${POSTGRES_DB:-meraglym_osint}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: meraglym-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meraglym}:${POSTGRES_PASSWORD:-meraglym_password}@db:5432/${POSTGRES_DB:-meraglym_osint}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: meraglym-web
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-meraglym}:${POSTGRES_PASSWORD:-meraglym_password}@db:5432/${POSTGRES_DB:-meraglym_osint}?schema=public
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/jobs').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: python/Dockerfile
    container_name: meraglym-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meraglym}:${POSTGRES_PASSWORD:-meraglym_password}@db:5432/${POSTGRES_DB:-meraglym_osint}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
