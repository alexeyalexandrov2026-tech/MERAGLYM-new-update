name: shopbot-ci

on:
  push:
    paths: ["ecommerce-bot/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["ecommerce-bot/**", ".github/workflows/ci.yml"]

defaults:
  run:
    working-directory: ecommerce-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ecommerce-bot/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests migrations
      - run: pytest -q
      # The migration must compile to valid PostgreSQL DDL.
      - run: alembic upgrade head --sql
        env:
          ENVIRONMENT: test
          PAYMENT_PROVIDER: fake
          DATABASE_URL: postgresql+asyncpg://u:p@localhost:5432/shopbot
