name: meduza-v-ci

on:
  push:
    paths: ["meduza-v/**", ".github/workflows/meduza-v-ci.yml"]
  pull_request:
    paths: ["meduza-v/**", ".github/workflows/meduza-v-ci.yml"]

defaults:
  run:
    working-directory: meduza-v

jobs:
  # Fast gate: no services needed, so it fails in seconds on an obvious break.
  lint-and-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: meduza-v/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests migrations
      - name: Installer scripts are valid
        shell: bash
        run: |
          bash -n installer/install.sh
          bash -n installer/uninstall.sh
          pwsh -NoProfile -Command '
            $bad = $false
            foreach ($f in @("installer/install.ps1","installer/uninstall.ps1")) {
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path $f), [ref]$null, [ref]$errors)
              if ($errors.Count -gt 0) { $bad = $true; $errors | ForEach-Object { Write-Host $_ } }
            }
            if ($bad) { exit 1 }'
      - name: Tests (SQLite; concurrency tests skipped)
        run: pytest -q
      - name: Migration compiles to PostgreSQL DDL
        run: alembic upgrade head --sql
        env:
          ENVIRONMENT: test
          PAYMENT_PROVIDER: fake
          DATABASE_URL: postgresql+asyncpg://u:p@localhost:5432/meduza

  # Full gate: the concurrency and row-locking tests only mean anything against
  # a real PostgreSQL server, and the shared rate limiter needs a real Redis.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meduza
          POSTGRES_PASSWORD: meduza
          POSTGRES_DB: meduza_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meduza -d meduza_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://meduza:meduza@127.0.0.1:5432/meduza_test
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
      DATABASE_URL: postgresql+asyncpg://meduza:meduza@127.0.0.1:5432/meduza_test
      ENVIRONMENT: test
      PAYMENT_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: meduza-v/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply and roll back
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Seed data loads
        run: python -m app.seed
      - name: Full test suite (concurrency + Redis included)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image builds
        run: docker build -t meduza-v:ci .
      - name: Compose file is valid
        # compose resolves `env_file: [.env]` at parse time, so the file must
        # exist even for a config check. This mirrors the documented first step.
        run: |
          cp .env.example .env
          docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder
