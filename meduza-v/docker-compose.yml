# Local/self-hosted 24/7 stack: database, cache, web tier, worker.
# `restart: unless-stopped` is what keeps the bot running across crashes and
# host reboots; on a managed platform the platform's own restart policy and
# health checks replace it (see README).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meduza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-meduza}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Nightly logical backups land here; see the `backup` service.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meduza} -d ${POSTGRES_DB:-meduza}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host: only the app network can reach the database.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    expose:
      - "6379"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The worker is idempotent and uses SELECT ... FOR UPDATE SKIP LOCKED, so
    # it scales horizontally; start with one.
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # Nightly pg_dump, 14-day retention. Copy these off-host: a backup that
    # lives only on the machine it backs up is not a backup.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump \
            -h db -U "$${POSTGRES_USER:-meduza}" -d "$${POSTGRES_DB:-meduza}" -Fc \
            -f "/backups/meduza-$$(date +%Y%m%dT%H%M%SZ).dump" \
            && echo "backup ok $$(date -u +%FT%TZ)" \
            || echo "BACKUP FAILED $$(date -u +%FT%TZ)"
          find /backups -name 'meduza-*.dump' -mtime +14 -delete
          sleep 86400
        done

volumes:
  pgdata:
